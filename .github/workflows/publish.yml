name: Publish Python Packages

on:
  release:
    types: [published]

jobs:
  publish-core:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Core Package
        run: |
          cd releases/whisper-dictator-core
          python -m build

      - name: Publish Core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: releases/whisper-dictator-core/dist/

  publish-ui-kit:
    needs: publish-core
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Since standard PyPI doesn't really host "CSS only" well without a python wrapper,
      # we assume the user might want to wrap this later. 
      # For now, we'll skip publishing the CSS kit to PyPI directly 
      # unless we wrap it as a python package `shlumzi-ui`.
      
  build-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
